name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public hygiene
        run: python3 tests/test_public_hygiene.py
      - name: Python compile
        run: python3 -m py_compile chip_relay/*.py
      - name: Full Python test discovery
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reproduce clean-room provenance audit
        run: |
          git clone --quiet https://github.com/scrapfly/Antibot-Detector.git /tmp/antibot-detector
          git -C /tmp/antibot-detector checkout --quiet e5341e9ff4e3fdd5302a93980d74b9923686e987
          python3 scripts/audit-protection-clean-room.py \
            --repo-root . \
            --upstream-root /tmp/antibot-detector \
            --check docs/protection-diagnostics-clean-room-audit.json
      - name: Shell syntax
        run: python3 tests/test_shell_syntax.py
      - name: Skill guard
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('SKILL.md').read_text()
          assert p.startswith('---\n')
          front = p.split('---', 2)[1]
          fields = {}
          for line in front.splitlines():
              if ':' in line and not line.startswith(' '):
                  k, v = line.split(':', 1)
                  fields[k.strip()] = v.strip().strip('"')
          assert fields.get('name') == 'chip-relay'
          assert fields.get('description') and len(fields['description']) <= 1024
          PY
